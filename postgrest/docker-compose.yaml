name: acp

services:
  postgrest:
    image: postgrest/postgrest:v14.3
    container_name: postgrest
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: web_anon
    networks:
      - acp_network
  
  swagger:
    image: swaggerapi/swagger-ui:v5.31.0
    container_name: swagger
    ports:
      - "8080:8080"
    expose:
      - "8080"
    environment:
      API_URL: http://localhost:3000/
    networks:
      - acp_network

networks:
  acp_network:
    name: acp_network