name: acp

services:
  ollama:
    container_name: ollama
    image: ollama/ollama:0.10.1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama # Persistent storage for Ollama models
      - ./entrypoint.sh:/entrypoint.sh
    networks:
      - acp_network
    deploy:
      resources:
        limits:
          cpus: '5.0'
          memory: 10G
    entrypoint: ["/usr/bin/bash", "/entrypoint.sh"]

volumes:
  ollama_data:

networks:
  acp_network:
    name: acp_network